<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对局回放</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--dim:#8b949e;--accent:#58a6ff;--red:#f85149;--green:#3fb950;--yellow:#d29922}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.header{width:100%;max-width:900px;padding:24px 20px 0;display:flex;align-items:center;gap:12px}
.header h1{font-size:18px;font-weight:600;color:var(--text)}
.header .meta{font-size:13px;color:var(--dim);margin-left:auto}
.player-wrap{width:100%;max-width:900px;padding:20px}
.info-bar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.info-chip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px}
.info-chip b{color:var(--accent)}
.controls{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:16px}
.controls button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:8px 18px;font-size:14px;cursor:pointer;font-weight:600;transition:background .15s}
.controls button:hover{background:#79c0ff}
.controls button.pause{background:var(--yellow)}
.progress-wrap{flex:1;position:relative;height:6px;background:var(--border);border-radius:3px;cursor:pointer}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .1s linear}
.time-label{font-size:13px;color:var(--dim);min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.speed-select{background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 8px;font-size:13px;cursor:pointer}
.log-area{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;max-height:50vh;overflow-y:auto;font-family:'Cascadia Code','Fira Code',monospace;font-size:12px;line-height:1.6}
.log-area .msg{padding:2px 0;border-bottom:1px solid rgba(48,54,61,0.4)}
.log-area .msg .ts{color:var(--dim);margin-right:8px}
.log-area .msg .tp{color:var(--accent);margin-right:6px;font-weight:600}
.loading{text-align:center;padding:60px 20px;color:var(--dim);font-size:16px}
.error{text-align:center;padding:60px 20px;color:var(--red);font-size:16px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 14px;text-align:center}
.stat-box .val{font-size:22px;font-weight:700;color:var(--accent)}
.stat-box .lbl{font-size:11px;color:var(--dim);margin-top:2px}
</style>
</head>
<body>

<div class="header">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>
  <h1>对局回放</h1>
  <span class="meta" id="metaInfo"></span>
</div>

<div class="player-wrap">
  <div id="loadingState" class="loading">加载回放数据...</div>
  <div id="errorState" class="error" style="display:none"></div>
  <div id="playerUI" style="display:none">

    <div class="info-bar" id="infoBar"></div>

    <div class="stats-grid" id="liveStats"></div>

    <div class="controls">
      <button id="playBtn" onclick="togglePlay()">▶ 播放</button>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <span class="time-label" id="timeLabel">00:00 / 00:00</span>
      <select class="speed-select" id="speedSelect" onchange="setSpeed(this.value)">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
        <option value="8">8x</option>
      </select>
    </div>

    <div class="log-area" id="logArea"></div>
  </div>
</div>

<script>
let recording = null;
let playing = false;
let currentIdx = 0;
let playTimer = null;
let speed = 1;
let startTs = 0;
let totalDuration = 0;

const params = new URLSearchParams(location.search);
const recId = params.get('id');
const shareToken = params.get('share');

async function loadData() {
  try {
    let url;
    const headers = {};
    if (shareToken) {
      url = '/api/share/' + encodeURIComponent(shareToken);
    } else if (recId) {
      url = '/api/recording/' + encodeURIComponent(recId);
      const token = localStorage.getItem('admin_token');
      if (token) headers['Authorization'] = 'Bearer ' + token;
    } else {
      showError('缺少回放参数 (id 或 share)');
      return;
    }
    const res = await fetch(url, { headers });
    const data = await res.json();
    if (!data.ok) {
      showError(data.error || '回放数据不存在或链接已过期');
      return;
    }

    if (data.externalUrl) {
      updateProgress('从外链加载回放数据...');
      const extRes = await fetch(data.externalUrl);
      if (!extRes.ok) { showError('外链加载失败: HTTP ' + extRes.status); return; }
      const extData = await extRes.json();
      recording = extData;
      initPlayer();
      return;
    }

    if (!data.recording) {
      showError('回放数据不存在');
      return;
    }
    recording = data.recording;
    initPlayer();
  } catch (e) {
    showError('加载失败: ' + e.message);
  }
}

function showError(msg) {
  document.getElementById('loadingState').style.display = 'none';
  const el = document.getElementById('errorState');
  el.textContent = msg;
  el.style.display = '';
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  return String(m).padStart(2,'0') + ':' + String(s % 60).padStart(2,'0');
}

function initPlayer() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('playerUI').style.display = '';

  const meta = recording.metadata || {};
  totalDuration = meta.duration || (recording.messages.length > 0 ? recording.messages[recording.messages.length - 1].timestamp : 0);

  document.getElementById('metaInfo').textContent =
    (meta.roomKey || recording.id || '') + ' · ' + (meta.messageCount || recording.messages.length) + ' msgs';

  const bar = document.getElementById('infoBar');
  const chips = [];
  if (meta.roomKey) chips.push('<div class="info-chip">房间 <b>' + esc(meta.roomKey) + '</b></div>');
  if (meta.mapName) chips.push('<div class="info-chip">地图 <b>' + esc(meta.mapName) + '</b></div>');
  chips.push('<div class="info-chip">消息 <b>' + (recording.messages.length) + '</b></div>');
  chips.push('<div class="info-chip">时长 <b>' + fmtTime(totalDuration) + '</b></div>');
  if (recording.createdAt) {
    chips.push('<div class="info-chip">录制于 <b>' + new Date(recording.createdAt).toLocaleString() + '</b></div>');
  }
  bar.innerHTML = chips.join('');

  updateTimeLabel();

  document.getElementById('progressWrap').addEventListener('click', (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    seekTo(ratio);
  });
}

function togglePlay() {
  if (playing) {
    pausePlayback();
  } else {
    startPlayback();
  }
}

function startPlayback() {
  if (!recording || !recording.messages.length) return;
  if (currentIdx >= recording.messages.length) {
    currentIdx = 0;
    document.getElementById('logArea').innerHTML = '';
  }
  playing = true;
  document.getElementById('playBtn').textContent = '⏸ 暂停';
  document.getElementById('playBtn').classList.add('pause');
  scheduleNext();
}

function pausePlayback() {
  playing = false;
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  document.getElementById('playBtn').textContent = '▶ 播放';
  document.getElementById('playBtn').classList.remove('pause');
}

function scheduleNext() {
  if (!playing || currentIdx >= recording.messages.length) {
    if (currentIdx >= recording.messages.length) pausePlayback();
    return;
  }
  const msg = recording.messages[currentIdx];
  const prevTs = currentIdx > 0 ? recording.messages[currentIdx - 1].timestamp : 0;
  const delay = Math.max(0, (msg.timestamp - prevTs) / speed);
  const cappedDelay = Math.min(delay, 2000 / speed);

  playTimer = setTimeout(() => {
    processMessage(msg);
    currentIdx++;
    updateProgress();
    scheduleNext();
  }, cappedDelay);
}

function processMessage(msg) {
  const logArea = document.getElementById('logArea');
  let typeStr = '?';
  let preview = '';

  if (msg.type === 'text') {
    try {
      const obj = JSON.parse(msg.data);
      typeStr = obj.type || 'text';
      if (obj.type === 'mapName') preview = obj.data || '';
      else if (obj.data && Array.isArray(obj.data)) preview = obj.data.length + ' items';
      else if (obj.data && typeof obj.data === 'object') preview = JSON.stringify(obj.data).slice(0, 80);
      updateLiveStats(obj);
    } catch (e) {
      typeStr = 'text';
      preview = msg.data.slice(0, 80);
    }
  } else {
    typeStr = 'binary';
    preview = (msg.data ? msg.data.length : 0) + ' bytes (b64)';
  }

  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = '<span class="ts">' + fmtTime(msg.timestamp) + '</span><span class="tp">' + esc(typeStr) + '</span>' + esc(preview);
  logArea.appendChild(div);
  if (logArea.children.length > 500) logArea.removeChild(logArea.firstChild);
  logArea.scrollTop = logArea.scrollHeight;
}

const _liveCounts = {};
function updateLiveStats(obj) {
  if (!obj || !obj.type) return;
  if (obj.data && Array.isArray(obj.data)) {
    _liveCounts[obj.type] = obj.data.length;
  } else if (obj.type === 'mapName') {
    _liveCounts.mapName = obj.data || '';
  }
  renderLiveStats();
}

const _typeLabels = {
  players:'玩家', bots:'人机', items:'物品', containers:'容器', exits:'撤离',
  boxes:'盒子', doors:'门', self:'自身', mapName:'地图'
};
function renderLiveStats() {
  const el = document.getElementById('liveStats');
  const keys = Object.keys(_liveCounts);
  if (!keys.length) { el.innerHTML = ''; return; }
  el.innerHTML = keys.map(k => {
    const v = _liveCounts[k];
    const label = _typeLabels[k] || k;
    return '<div class="stat-box"><div class="val">' + esc(String(v)) + '</div><div class="lbl">' + esc(label) + '</div></div>';
  }).join('');
}

function updateProgress() {
  if (!recording || !recording.messages.length) return;
  const current = currentIdx > 0 ? recording.messages[Math.min(currentIdx, recording.messages.length) - 1].timestamp : 0;
  const pct = totalDuration > 0 ? (current / totalDuration * 100) : 0;
  document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
  updateTimeLabel(current);
}

function updateTimeLabel(current) {
  document.getElementById('timeLabel').textContent = fmtTime(current || 0) + ' / ' + fmtTime(totalDuration);
}

function seekTo(ratio) {
  if (!recording || !recording.messages.length) return;
  const targetTs = totalDuration * Math.max(0, Math.min(1, ratio));
  let idx = 0;
  for (let i = 0; i < recording.messages.length; i++) {
    if (recording.messages[i].timestamp <= targetTs) idx = i;
    else break;
  }
  currentIdx = idx;
  document.getElementById('logArea').innerHTML = '';
  Object.keys(_liveCounts).forEach(k => delete _liveCounts[k]);
  updateProgress();
  if (playing) {
    clearTimeout(playTimer);
    scheduleNext();
  }
}

function setSpeed(v) { speed = parseFloat(v) || 1; }

loadData();
</script>
</body>
</html>
